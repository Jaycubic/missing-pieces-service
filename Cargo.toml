[package]
name    = "missing-pieces-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "missing-pieces-service"
path = "src/main.rs"

[dependencies]
# ── Web framework ─────────────────────────────────────────────────────────────
actix-web       = "4"
actix-rt        = "2"
actix-files     = "0.6"
actix-ws        = "0.2"

# ── Async runtime ─────────────────────────────────────────────────────────────
tokio           = { version = "1", features = ["full"] }
futures-util    = "0.3"

# ── DB: PostgreSQL async (content + durable analytics only, not live state) ──
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Utilities ─────────────────────────────────────────────────────────────────
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow    = "1"
rand      = "0.8"

[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
